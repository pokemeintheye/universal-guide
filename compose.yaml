services:
  universal-guide:
    image: ghcr.io/pokemeintheye/universal-guide:latest
    container_name: universal-guide
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PLEX_URL: "${PLEX_URL}"
      PLEX_TOKEN: "${PLEX_TOKEN}"
      PLEX_ALLOWED_LABEL: "${PLEX_ALLOWED_LABEL:-}"
      PLEX_LABEL_MODE: "${PLEX_LABEL_MODE:-allow}"
      REFRESH_MINUTES: "30"
      GUIDE_XMLTV: /data/guide.xml
      TABLO_URL: "${TABLO_URL:-}"
      TABLO_REFRESH_HOURS: "6"
      TABLO_DVR_MINUTES: "${TABLO_DVR_MINUTES:-20}"
      TABLO_CACHE_DIR: "${TABLO_CACHE_DIR:-/data/tablo-live-cache}"
      PHILO_REFRESH_HOURS: "24"
    volumes:
      - /mnt/user/appdata/universal-guide:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
