name: Build Apple TV preview
on:
  push:
    branches: [main]
    paths:
      - 'tvOS/**'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Apple TV branding when present
        working-directory: tvOS
        run: |
          python3 -m venv "$RUNNER_TEMP/brand-venv"
          "$RUNNER_TEMP/brand-venv/bin/pip" install pillow
          "$RUNNER_TEMP/brand-venv/bin/python" scripts/generate_brand_assets.py --optional
      - name: Generate Xcode project
        working-directory: tvOS
        run: xcodegen generate
      - name: Build unsigned Apple TV Simulator app
        working-directory: tvOS
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project UniversalGuideTV.xcodeproj \
            -scheme UniversalGuideTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload build diagnostics if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGuideTV-build-log
          path: tvOS/xcodebuild.log
          if-no-files-found: ignore
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGuideTV-simulator
          path: tvOS/build/Build/Products/Debug-appletvsimulator/UniversalGuideTV.app
          if-no-files-found: error
