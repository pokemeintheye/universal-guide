name: Verify live playback backend
on:
  push:
    branches:
      - feature/backend-driven-live-options-20261115
    paths:
      - 'app/channels_dvr.py'
      - 'tests/test_channels_dvr_guide_options.py'
      - '.github/workflows/live-backend-test.yml'
  pull_request:
    paths:
      - 'app/channels_dvr.py'
      - 'tests/test_channels_dvr_guide_options.py'
      - '.github/workflows/live-backend-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate backend Python
        run: python -m py_compile app/channels_dvr.py app/main.py
      - name: Test backend live source selection
        run: python -m unittest discover -s tests -p 'test_channels_dvr_guide_options.py' -v
