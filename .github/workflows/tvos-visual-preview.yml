name: Apple TV visual preview screenshot

on:
  workflow_dispatch:
  push:
    branches: [main, tvos-visual-preview-20261112, tvos-auto-visual-development]
    paths:
      - 'tvOS/**'
      - 'Shared/**'
      - '.github/workflows/tvos-visual-preview.yml'

permissions:
  contents: read

concurrency:
  group: tvos-visual-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Xcode and available Apple TV simulators
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list runtimes

      - name: Generate app assets and Xcode project
        shell: bash
        working-directory: tvOS
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/brand-venv"
          "$RUNNER_TEMP/brand-venv/bin/pip" install pillow
          "$RUNNER_TEMP/brand-venv/bin/python" scripts/generate_brand_assets.py --optional
          xcodegen generate

      - name: Build Apple TV simulator app
        shell: bash
        working-directory: tvOS
        run: |
          set -euo pipefail
          xcodebuild -project UniversalGuideTV.xcodeproj \
            -scheme UniversalGuideTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-visual-preview.log

      - name: Select a 1080p Apple TV simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          matches = []
          for runtime, devices in data.get("devices", {}).items():
              if "tvOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable", True) and "Apple TV" in device.get("name", ""):
                      matches.append((device["name"], device["udid"]))
          if not matches:
              raise SystemExit("No available tvOS simulator; screenshot not created")
          selected = next(((name, udid) for name, udid in matches
                           if "1080p" in name), matches[0])
          print("SIMULATOR_UDID=" + selected[1])
          print("Selected simulator:", selected[0], file=sys.stderr)
          PY

      - name: Boot simulator and capture visible guide screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-preview
          # CoreSimulator can report boot complete before TVOut has a usable
          # surface on hosted macOS runners. Retry screenshot acquisition
          # instead of failing the entire workflow on the first code-60 timeout.
          capture_tvout() {
            local destination="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if xcrun simctl io "$SIMULATOR_UDID" screenshot "$destination"; then
                return 0
              fi
              echo "::warning::TVOut screenshot attempt $attempt failed for $destination; waiting for display surfaces"
              xcrun simctl list devices | grep -F "$SIMULATOR_UDID" || true
              sleep 10
              open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_UDID" || true
            done
            echo "::error::TVOut screenshot remained unavailable after four attempts: $destination"
            xcrun simctl diagnose -h >/dev/null 2>&1 || true
            return 1
          }
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          # Open the GUI window so TVOut is actually driven by the simulator,
          # not just a booted headless CoreSimulator device.
          open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_UDID"
          sleep 5
          APP="tvOS/build/Build/Products/Debug-appletvsimulator/UniversalGuideTV.app"
          test -d "$APP"
          xcrun simctl install "$SIMULATOR_UDID" "$APP"
          capture_tvout visual-preview/before-launch.png

          # First establish whether this hosted runner can present ANY scene
          # from our app on TVOut. Probe and guide share bundle and runtime.
          xcrun simctl launch "$SIMULATOR_UDID" co.thejonesfamily.universalguide --visual-preview-shell
          sleep 12
          capture_tvout visual-preview/simulator-probe.png
          "$RUNNER_TEMP/brand-venv/bin/python" - <<'PY'
          from PIL import Image, ImageFilter, ImageStat
          im = Image.open("visual-preview/simulator-probe.png").convert("L").resize((480, 270))
          edges = ImageStat.Stat(im.filter(ImageFilter.FIND_EDGES))
          print(f"Guide shell edge mean={edges.mean[0]:.2f}, spread={edges.stddev[0]:.2f}")
          # Sparse white diagnostic text on a flat charcoal canvas has a low
          # mean edge score despite being visible (observed 1.91 / 19.48).
          # Reject only low edge spread here; retain stricter guide validation.
          if edges.stddev[0] < 12:
              raise SystemExit("Guide shell failed to render: failure occurs before TVGuideScreen construction")
          PY

          # The probe rendered correctly, but terminating and relaunching the
          # same app left TVOut on blurred wallpaper in earlier runs. Give the
          # guide a clean simulator boot and fresh installation instead of
          # relying on the in-place scene transition.
          xcrun simctl terminate "$SIMULATOR_UDID" co.thejonesfamily.universalguide || true
          xcrun simctl shutdown "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_UDID"
          sleep 8
          xcrun simctl uninstall "$SIMULATOR_UDID" co.thejonesfamily.universalguide || true
          xcrun simctl install "$SIMULATOR_UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" co.thejonesfamily.universalguide --visual-preview
          # GitHub previously marked a wallpaper-only image as success.
          # Recheck until the captured screen visibly changes from home.
          VISIBLE=0
          for attempt in 1 2 3 4 5; do
            sleep 12
            capture_tvout visual-preview/apple-tv-guide.png
            if "$RUNNER_TEMP/brand-venv/bin/python" - <<'PY'
          from PIL import Image, ImageFilter, ImageStat
          # A transition from tvOS home to its blurred wallpaper used to
          # produce a false positive. Verify actual high-frequency UI detail.
          after = Image.open("visual-preview/apple-tv-guide.png").convert("L").resize((480, 270))
          edges = after.filter(ImageFilter.FIND_EDGES)
          edge_mean = ImageStat.Stat(edges).mean[0]
          edge_spread = ImageStat.Stat(edges).stddev[0]
          print(f"Visible guide detail: mean edge={edge_mean:.2f}, spread={edge_spread:.2f}")
          if edge_mean < 5 or edge_spread < 14:
              raise SystemExit("No visible guide UI; likely tvOS blurred wallpaper")
          PY
            then
              VISIBLE=1
              break
            fi
            echo "Attempt $attempt: guide not visible; checking again."
          done
          if [ "$VISIBLE" != 1 ]; then
            echo "::error::Guide never appeared on TVOut; preserving screenshots and simulator diagnostics."
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3m --style compact \
              --predicate 'process == "UniversalGuideTV" OR eventMessage CONTAINS "co.thejonesfamily.universalguide" OR eventMessage CONTAINS "UG_PREVIEW_STAGE" OR eventMessage CONTAINS "watchdog" OR eventMessage CONTAINS "scene-create"' \
              > visual-preview/simulator-app.log 2>&1 || true
            echo "---- Guide preview lifecycle markers ----"
            grep -E 'UG_PREVIEW_STAGE|watchdog|scene-create|crash' visual-preview/simulator-app.log | tail -80 || true
            echo "---- Simulator application process ----"
            xcrun simctl spawn "$SIMULATOR_UDID" launchctl list | grep -i universalguide || true
            exit 1
          fi
          sips -g pixelWidth -g pixelHeight visual-preview/apple-tv-guide.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-visual-preview
          path: visual-preview/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log if the preview fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-visual-preview-diagnostics
          path: |
            tvOS/xcodebuild-visual-preview.log
            visual-preview/simulator-app.log
          if-no-files-found: ignore
