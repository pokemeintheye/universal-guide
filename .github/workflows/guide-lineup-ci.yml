name: Verify guide lineup controls
on:
  push:
    branches: [feature/custom-guide-lineup]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo install -d -m 0777 /data
      - name: Validate UI JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("app/static/manage.html").read_text()
          Path("/tmp/lineup.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/lineup.js
      - name: Backend tests
        run: python -m unittest discover -s tests -v
