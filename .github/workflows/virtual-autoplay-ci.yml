name: Verify virtual continuous playback
on:
  push:
    branches: [feature/virtual-channel-autoplay]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo install -d -m 0777 /data
      - run: python -m unittest discover -s tests -v
