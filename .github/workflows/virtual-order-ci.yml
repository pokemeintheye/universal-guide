name: Verify virtual channel browsing order
on:
  push:
    branches: [fix/virtual-channels-first-in-guide]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo install -d -m 0777 /data
      - run: python -m unittest discover -s tests -v
