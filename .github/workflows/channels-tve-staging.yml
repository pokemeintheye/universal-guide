name: Build experimental Channels DVR TVE Docker image
on:
  push:
    branches:
      - feature/channels-dvr-expanded-tve
permissions:
  contents: read
  packages: write
concurrency:
  group: channels-dvr-tve-test
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:channels-tve-test
