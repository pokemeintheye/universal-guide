name: Publish Apple TV TestFlight build
on:
  workflow_dispatch:
  # One-time release-branch trigger: build the latest main code without
  # starting another Docker publish or reusing the old stuck workflow runs.
  push:
    branches:
      - tvos-testflight-release-20261111
    paths:
      - '.github/workflows/tvos-testflight.yml'
permissions:
  contents: read
concurrency:
  group: universal-guide-testflight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26-intel
    env:
      BUNDLE_ID: co.thejonesfamily.universalguide
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.APPLE_TV_PROVISIONING_PROFILE_BASE64 }}
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Verify signing secrets exist
        shell: bash
        run: |
          for name in APPLE_TEAM_ID CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 API_KEY_ID API_ISSUER_ID API_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret (see tvOS/TESTFLIGHT.md): $name"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate required Apple TV branding
        working-directory: tvOS
        run: |
          python3 -m venv "$RUNNER_TEMP/brand-venv"
          "$RUNNER_TEMP/brand-venv/bin/pip" install pillow
          "$RUNNER_TEMP/brand-venv/bin/python" scripts/generate_brand_assets.py
      - name: Set and verify unique TestFlight build version
        working-directory: tvOS
        shell: bash
        run: |
          set -euo pipefail
          # Use an increasing numeric version for each newly dispatched run.
          # Reserve two digits for retry attempts (1-99).
          if [ "$GITHUB_RUN_ATTEMPT" -gt 99 ]; then
            echo "::error::More than 99 attempts for one publishing run"
            exit 1
          fi
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          export BUILD_NUMBER
          # XcodeGen regenerates the Xcode project from project.yml. Its
          # CURRENT_PROJECT_VERSION was hard-coded to 1, so update it BEFORE
          # generating the project, not only on the xcodebuild command line.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          number = os.environ["BUILD_NUMBER"] if "BUILD_NUMBER" in os.environ else None
          if number is None:
              raise SystemExit("BUILD_NUMBER must be exported")
          config = Path("project.yml")
          content = config.read_text()
          updated, count = re.subn(r"(?m)^([ \t]*CURRENT_PROJECT_VERSION:[ \t]*)[^\n]+$",
                                   lambda m: m.group(1) + number, content)
          if count != 1:
              raise SystemExit(f"Expected one CURRENT_PROJECT_VERSION entry; got {count}")
          config.write_text(updated)
          print("XcodeGen version:", number)
          PY
      - name: Generate tvOS Xcode project
        working-directory: tvOS
        run: xcodegen generate
      - name: Verify generated app version
        working-directory: tvOS
        shell: bash
        run: |
          set -euo pipefail
          # XcodeGen's target info:path generates/replaces Info.plist.
          # Update the actual generated file AFTER running xcodegen.
          echo "Info.plist version produced by XcodeGen:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          SOURCE_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          echo "Final generated Info.plist CFBundleVersion: $SOURCE_BUILD"
          test "$SOURCE_BUILD" = "$BUILD_NUMBER"
          # Also show the build system's actual resolved version before signing.
          xcodebuild -project UniversalGuideTV.xcodeproj \
            -scheme UniversalGuideTV -configuration Release -sdk appletvos \
            -showBuildSettings | grep -E '^[[:space:]]*(CURRENT_PROJECT_VERSION|GENERATE_INFOPLIST_FILE|INFOPLIST_FILE|INFOPLIST_KEY_CFBundleVersion) =' || true

      - name: Import distribution certificate and tvOS profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/universal-guide.keychain-db"
          PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN"

          PROFILE="$RUNNER_TEMP/tvos-appstore.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile belongs to a different Apple team"
            exit 1
          fi
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile does not match the Universal Guide bundle ID"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Archive signed Apple TV app
        working-directory: tvOS
        shell: bash
        run: |
          set -euo pipefail
          echo "Archiving Universal Guide build $BUILD_NUMBER"
          xcodebuild -project UniversalGuideTV.xcodeproj \
            -scheme UniversalGuideTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/UniversalGuideTV.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          ARCHIVE_INFO="$RUNNER_TEMP/UniversalGuideTV.xcarchive/Products/Applications/UniversalGuideTV.app/Info.plist"
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_INFO")
          echo "Archived CFBundleVersion: $ACTUAL_BUILD"
          if [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::Archive build version does not match expected $BUILD_NUMBER"
            exit 1
          fi
          # Explicitly assert the signed tvOS app declares exempt encryption;
          # merely listing it in project.yml is not enough if XcodeGen changes.
          ENCRYPTION=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$ARCHIVE_INFO" || true)
          echo "Archived ITSAppUsesNonExemptEncryption: $ENCRYPTION"
          if [ "$ENCRYPTION" != "false" ] && [ "$ENCRYPTION" != "NO" ]; then
            echo "::error::Signed Apple TV app is missing ITSAppUsesNonExemptEncryption=NO"
            exit 1
          fi

      - name: Export signed IPA
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/UniversalGuideTV.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Prepare App Store Connect API key
        id: appstore_api_key
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
          test -s "$KEY_FILE"
          DELIMITER="UG_TV_KEY_$(openssl rand -hex 16)"
          {
            echo "private_key<<$DELIMITER"
            cat "$KEY_FILE"
            echo
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Locate Apple TV IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/Export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -s "$IPA"
          echo "app_path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Apple TV IPA prepared: $(du -h "$IPA" | cut -f1)"

      - name: Upload Apple TV to TestFlight using App Store Connect API
        timeout-minutes: 20
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.app_path }}
          app-type: appletvos
          backend: AppStoreAPI
          issuer-id: ${{ env.API_ISSUER_ID }}
          api-key-id: ${{ env.API_KEY_ID }}
          api-private-key: ${{ steps.appstore_api_key.outputs.private_key }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'

      - name: Clean local signing materials
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8" || true
