name: Build iPhone Backbone preview
on:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'tvOS/Sources/**'
      - 'Shared/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'iOS/**'
      - 'tvOS/Sources/**'
      - 'Shared/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iPhone app icons
        working-directory: iOS
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-icon-venv"
          "$RUNNER_TEMP/ios-icon-venv/bin/pip" install pillow
          "$RUNNER_TEMP/ios-icon-venv/bin/python" scripts/generate_app_icons.py
      - name: Generate iPhone Xcode project
        working-directory: iOS
        run: xcodegen generate
      - name: Build unsigned iPhone Simulator app
        working-directory: iOS
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project UniversalGuidePhone.xcodeproj \
            -scheme UniversalGuidePhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Smoke test iPhone app launch in Simulator
        working-directory: iOS
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p launch-diagnostics
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; candidates=[x["udid"] for devices in d.values() for x in devices if x["name"].startswith("iPhone") and x.get("state") in ("Shutdown","Booted") and x.get("isAvailable",True)]; print(candidates[0] if candidates else "")')"
          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator available to validate app launch"
            exit 1
          fi
          echo "Testing iOS launch on $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="build/Build/Products/Debug-iphonesimulator/UniversalGuidePhone.app"
          xcrun simctl install "$DEVICE" "$APP"
          set +e
          xcrun simctl launch "$DEVICE" co.thejonesfamily.universalguide.iphone > launch-diagnostics/launch.txt 2>&1
          LAUNCH_RESULT=$?
          sleep 12
          xcrun simctl spawn "$DEVICE" launchctl list > launch-diagnostics/processes.txt 2>&1
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "UniversalGuidePhone"' > launch-diagnostics/app-log.txt 2>&1
          xcrun simctl io "$DEVICE" screenshot launch-diagnostics/screenshot.png || true
          cp -R "$HOME/Library/Logs/DiagnosticReports/." launch-diagnostics/ 2>/dev/null || true
          set -e
          cat launch-diagnostics/launch.txt
          if [ "$LAUNCH_RESULT" -ne 0 ]; then
            echo "::error::iPhone app launch failed"
            exit 1
          fi
          if ! grep -q 'co.thejonesfamily.universalguide.iphone' launch-diagnostics/processes.txt; then
            echo "::error::App process disappeared within 12 seconds of launch; review simulator diagnostics"
            exit 1
          fi
      - name: Upload simulator launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGuidePhone-launch-diagnostics
          path: iOS/launch-diagnostics/
          if-no-files-found: ignore
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGuidePhone-build-log
          path: iOS/xcodebuild.log
          if-no-files-found: ignore
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGuidePhone-simulator
          path: iOS/build/Build/Products/Debug-iphonesimulator/UniversalGuidePhone.app
          if-no-files-found: error
