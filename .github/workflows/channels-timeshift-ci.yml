name: Verify Channels DVR timeshift development
on:
  push:
    branches: [feature/channels-dvr-disk-timeshift]
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile app/live_timeshift.py app/channels_dvr.py app/main.py
      - name: Prepare container-equivalent writable data directory
        run: sudo install -d -m 0777 /data
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
