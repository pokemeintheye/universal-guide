name: Verify Channels DVR EPG source preference
on:
  push:
    branches: [feature/channels-dvr-epg-priority]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo install -d -m 0777 /data
      - name: Compile and test
        run: |
          python -m py_compile app/channels_epg.py app/main.py
          python -m unittest discover -s tests -v
