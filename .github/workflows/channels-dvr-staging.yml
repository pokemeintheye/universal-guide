name: Build Channels DVR staging Docker image
on:
  push:
    branches:
      - feature/channels-dvr-hgtv-6104
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/channels-dvr-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: channels-dvr-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish separate staging tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:channels-hgtv-test
