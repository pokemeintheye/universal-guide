name: Validate Plex Labels and Tags smart channels
on:
  push:
    branches: [feature/smart-virtual-plex-labels-tags]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo install -d -m 0777 /data
      - name: Check Python and browser syntax
        run: |
          python -m py_compile app/main.py app/channel_management.py app/virtual_rules.py
          python - <<'PY'
          from pathlib import Path
          html=Path("app/static/manage.html").read_text()
          Path("/tmp/plex-smart-label-tags.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/plex-smart-label-tags.js
      - name: Run full Python tests
        run: python -m unittest discover -s tests -v
