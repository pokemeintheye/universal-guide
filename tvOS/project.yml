name: UniversalGuideTV
options:
  bundleIdPrefix: co.thejonesfamily
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TVOS_DEPLOYMENT_TARGET: 17.0
targets:
  UniversalGuideTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: ../Shared/GuideModels.swift
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Universal Guide connects to your Unraid TV guide and playback server on your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.thejonesfamily.universalguide
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
  UniversalGuideTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: UniversalGuideTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.thejonesfamily.universalguide.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UniversalGuideTV:
    build:
      targets:
        UniversalGuideTV: all
    run:
      config: Debug
    test:
      targets:
        - UniversalGuideTVUITests
