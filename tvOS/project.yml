name: UniversalGuideTV
options:
  bundleIdPrefix: com.universalguide
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TVOS_DEPLOYMENT_TARGET: 17.0
targets:
  UniversalGuideTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universalguide.tv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Universal Guide
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to your Universal Guide server on your local network."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
schemes:
  UniversalGuideTV:
    build:
      targets:
        UniversalGuideTV: all
    run:
      config: Debug
