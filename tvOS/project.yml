name: UniversalGuideTV
options:
  bundleIdPrefix: co.thejonesfamily
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TVOS_DEPLOYMENT_TARGET: 17.0
targets:
  UniversalGuideTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.thejonesfamily.universalguide
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
schemes:
  UniversalGuideTV:
    build:
      targets:
        UniversalGuideTV: all
    run:
      config: Debug
